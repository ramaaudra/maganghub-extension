<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lowongan Magang Nasional — MagangHub</title>
    <!--
      "MagangHub redesigned" fixture (issue #8). Same page, same data, same
      detail URLs — but the card class the content script hangs stars on
      (`.mh-lowongan-card`) and the inner field classes have been renamed.

      This is the breakage the health indicator exists for: the extension must
      no-op silently (no crash, no console errors) and tell the popup it may
      need an update, rather than appearing to work while silently doing
      nothing.
    -->
  </head>
  <body>
    <div id="__next">
      <main class="container mx-auto px-4 py-6">
        <h1 class="text-2xl font-bold">Lowongan Magang Nasional</h1>
        <section class="mt-6 grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
          <a class="group block h-full" href="/magang-nasional/lowongan/magang-data-analyst-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d">
            <div class="vacancy-card-v2 rounded-lg border p-4">
              <div class="flex items-center gap-3">
                <img class="vacancy-logo h-10 w-10 rounded-full" src="https://maganghub.kemnaker.go.id/logos/pt-maju.png" alt="Logo PT Maju Bersama" />
                <div>
                  <h3 class="vacancy-title text-base font-semibold">Magang Data Analyst</h3>
                  <p class="vacancy-org text-sm">PT Maju Bersama</p>
                </div>
              </div>
              <div class="mt-3 flex flex-wrap gap-2 text-sm">
                <span class="vacancy-location rounded px-2 py-0.5">Jakarta, DKI Jakarta</span>
              </div>
            </div>
          </a>
          <a class="group block h-full" href="/magang-nasional/lowongan/magang-software-engineer-b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e">
            <div class="vacancy-card-v2 rounded-lg border p-4">
              <div class="flex items-center gap-3">
                <img class="vacancy-logo h-10 w-10 rounded-full" src="https://maganghub.kemnaker.go.id/logos/kominfo.png" alt="Logo Kementerian Komunikasi" />
                <div>
                  <h3 class="vacancy-title text-base font-semibold">Magang Software Engineer</h3>
                  <p class="vacancy-org text-sm">Kementerian Komunikasi dan Informatika</p>
                </div>
              </div>
              <div class="mt-3 flex flex-wrap gap-2 text-sm">
                <span class="vacancy-location rounded px-2 py-0.5">Jakarta Pusat, DKI Jakarta</span>
              </div>
            </div>
          </a>
        </section>
      </main>
    </div>
  </body>
</html>
